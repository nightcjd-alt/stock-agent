name: access-check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pykrx yfinance requests
      - run: python scripts/check_access.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: Save result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/access_check.json
          git commit -m "access check result" || echo "no change"
          git push
